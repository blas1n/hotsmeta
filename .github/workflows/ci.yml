name: ci

# The gates from docs/HANDOFF.md, on every pull request (collect-and-deploy only runs on main).
on:
  pull_request:

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen
      - run: uv run ruff check collector/ tests/ tools/ && uv run ruff format --check collector/ tests/ tools/
      - run: uv run mypy collector/
      - run: uv run pytest tests/ --cov=collector --cov-fail-under=80

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen
      - run: uv run ruff check server/ tests/server/ && uv run ruff format --check server/ tests/server/
      - run: uv run mypy server/
      - run: uv run pytest tests/server/ --cov=server --cov-fail-under=80
      - run: docker build -f deploy/Dockerfile -t hpgg-api:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:cov
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
