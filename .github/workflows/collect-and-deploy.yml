name: collect-and-deploy

on:
  schedule:
    # 03:20 KST daily. GitHub registers a schedule from the default branch's workflow file; after the repo rename
    # (hotsmeta → hpgg, 2026-09-28) the first night (2026-09-29) produced no scheduled run at all — this commit
    # re-registers it. If a night is missed again: `gh run list --event schedule` is empty → dispatch once by hand.
    - cron: "20 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  collect:
    # cron / manual only — a push just rebuilds and deploys what is already in data/
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # stats ~25 min (24 calls at 1 a minute) + builds + matchups (≤ 25 min budget, + at most one
    # in-flight job poll of ≤ 15 min)
    timeout-minutes: 90
    outputs:
      day: ${{ steps.run.outputs.day }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # main takes no direct push (ruleset `main`, 2026-10-01); this deploy key is its one
          # bypass, so the data commit and the snapshot push go over SSH with it
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-dev
      - name: Collect (QM, SL, 브실골플, 다마그 × KR/NA/EU + solo twins = 24 stats calls, ~25 min at 1 req/min; 1 builds call; then Storm League matchups for heroes due, every other day)
        id: run
        env:
          HP_API_TOKEN: ${{ secrets.HP_API_TOKEN }}
        run: |
          uv run python -m collector
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # before the push, and whatever happens: 2026-10-02 the push was refused and the run's
      # data went with the runner (the week's quota could not pay for it again)
      - name: Keep the collected data as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: |
            data/latest
            data/previous
            data/matchups
            data/patchnotes.json
            data/.snapshot_out
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit data/latest (+ previous, matchups, patch notes) to main
        run: |
          git config user.name "hotsmeta-bot"
          git config user.email "bot@hpgg.win"
          git add data/latest
          if [ -d data/previous ]; then git add data/previous; fi
          if [ -d data/matchups ]; then git add data/matchups; fi
          if [ -f data/patchnotes.json ]; then git add data/patchnotes.json; fi
          git commit -m "data: $(date -u +%F) $(python3 -c 'import json;print(json.load(open("data/latest/meta.json"))["current_patch"])')" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push origin main
      - name: Archive raw + normalised snapshots to the orphan `snapshots` branch
        run: |
          set -e
          DAY="${{ steps.run.outputs.day }}"
          git fetch origin snapshots:snapshots || { echo "create the orphan branch once: git checkout --orphan snapshots && git commit --allow-empty -m init && git push origin snapshots"; exit 1; }
          git worktree add ../snap snapshots
          mkdir -p "../snap/snapshots/$DAY"
          cp -r "data/.snapshot_out/$DAY/." "../snap/snapshots/$DAY/"
          cd ../snap && git add snapshots && git commit -m "snapshot $DAY" && git push origin snapshots
      - name: Open an issue when the collector fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `collector failed ${new Date().toISOString().slice(0,10)}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["collector"],
            });

  deploy:
    needs: [collect]
    # run after a successful collect, or on push (collect is skipped then)
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web (skipped until web/ exists)
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run build
          else
            echo "web/ not present yet — publishing a placeholder + data/ (if any)"
            mkdir -p web/dist
            [ -d data ] && cp -r data web/dist/ || true
            printf '<!doctype html><meta charset="utf-8"><title>hpgg.win</title><p>준비 중 — 히오스 티어표</p>' > web/dist/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
