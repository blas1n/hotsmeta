<!doctype html>
<html lang="ko" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>영웅 상세 | HPGG · Heroes of the Storm</title>
    <meta name="description" content="영웅별 티어, 승률, 픽률, 밴률, 전장별 성적, 리그 구간별 성적, 인기 특성 빌드." />
    <link rel="icon" type="image/png" href="../img/brand/icon-sm.png" />
    <link rel="stylesheet" href="../src/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="hero-head" id="hero-head"><p class="meta" id="meta-line">불러오는 중…</p></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="게임 모드">
          <button type="button" id="mode-qm" class="seg-btn" aria-pressed="true">빠른 대전</button>
          <button type="button" id="mode-sl" class="seg-btn" aria-pressed="false">폭풍 리그</button>
        </div>
      </div>
      <nav class="subnav" aria-label="섹션">
        <a href="#s-stats" class="active">요약</a>
        <a href="#s-maps">전장</a>
        <a href="#s-brackets" id="nav-brackets" hidden>구간</a>
        <a href="#s-builds" id="nav-builds" hidden>특성 빌드</a>
      </nav>
      <div class="stat-grid" id="stats"></div>
      <h2 class="section-title" id="maps-title"><a id="s-maps"></a>전장별 승률</h2>
      <div class="rows" id="maps"></div>
      <h2 class="section-title" id="brackets-title" hidden><a id="s-brackets"></a>리그 구간별</h2>
      <div class="rows" id="brackets" hidden></div>
      <h2 class="section-title" id="builds-title" hidden><a id="s-builds"></a>인기 특성 빌드 <span class="muted" id="builds-sub"></span></h2>
      <div class="builds" id="builds" hidden></div>
      <div class="vote" id="vote" style="margin-top:16px">
        <span>이 티어, 체감과 맞나요?</span>
        <button type="button" class="vote-btn" data-vote="up" aria-label="맞다">👍</button>
        <button type="button" class="vote-btn" data-vote="down" aria-label="아니다">👎</button>
      </div>
    </main>
    <script type="module" src="../src/pages/hero.ts"></script>
    <script data-goatcounter="https://hpgg.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
